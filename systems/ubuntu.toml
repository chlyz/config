# Packages intentionally installed for this dotfiles setup on Ubuntu 22.04.
# This captures the platform packages needed by the portable user-level tools;
# Alacritty itself is installed at a pinned version by ./bootstrap.

[system]
distribution = "ubuntu"
release = "22.04"

[packages]
bootstrap = ["curl", "git"]
shell = ["fzf", "tmux", "zoxide", "zsh"]
applications = ["taskwarrior"]
alacritty_build = [
  "build-essential",
  "cmake",
  "fontconfig",
  "libfontconfig1-dev",
  "libxcb-xfixes0-dev",
  "libxkbcommon-dev",
  "ncurses-bin",
  "pkg-config",
  "python3",
]

# User-level Python command-line tools installed in isolated uv environments.
[uv_tools]
mdformat = ["mdformat-gfm"]
