# Packages intentionally installed for this dotfiles setup on Fedora 45.
# This is not a full image export: Fedora's base packages and their dependency
# closure are deliberately omitted.  Package versions stay unconstrained so a
# current Fedora release can resolve supported builds.

flatpak_apps = ["org.localsend.localsend_app"]

[system]
distribution = "fedora"
release = 45

[packages]
bootstrap = ["curl", "git"]
shell = ["bash-completion", "fzf", "tmux", "zoxide", "zsh"]
editors = ["emacs", "neovim"]
terminals = ["foot", "kitty"]
alacritty_build = [
  "cmake",
  "fontconfig-devel",
  "freetype-devel",
  "gcc",
  "libxcb-devel",
  "libxkbcommon-devel",
  "make",
  "ncurses",
  "pkgconf-pkg-config",
]
desktop = [
  "NetworkManager",
  "brightnessctl",
  "lxqt-policykit",
  "network-manager-applet",
  "nm-connection-editor",
  "pavucontrol",
  "playerctl",
  "rofi",
  "sway",
  "swayidle",
  "swaylock",
  "waybar",
]
# Requires the restricted COPR definition in systems/hyprland.repo.
hyprland = [
  "hyprland",
  "hyprland-guiutils",
  "hypridle",
  "hyprlock",
  "xdg-desktop-portal-hyprland",
  "xdg-desktop-portal-gtk",
  "xorg-x11-server-Xwayland",
]
wayland_tools = ["grim", "jq", "slurp", "wl-clipboard"]
applications = ["flatpak", "task", "zathura"]

# User-level Python command-line tools installed in isolated uv environments.
[uv_tools]
mdformat = ["mdformat-gfm"]
