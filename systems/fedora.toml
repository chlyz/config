# Packages intentionally installed for this dotfiles setup on Fedora 44.
# This is not a full image export: Fedora's base packages and their dependency
# closure are deliberately omitted.  Package versions stay unconstrained so a
# current Fedora release can resolve supported builds.

[system]
distribution = "fedora"
release = 44

[packages]
bootstrap = ["curl", "git"]
shell = ["bash-completion", "fzf", "tmux", "zoxide", "zsh"]
editors = ["emacs", "neovim"]
terminals = ["foot", "kitty"]
alacritty_build = [
  "cmake",
  "fontconfig-devel",
  "freetype-devel",
  "gcc",
  "libxcb-devel",
  "libxkbcommon-devel",
  "make",
  "ncurses",
  "pkgconf-pkg-config",
]
desktop = [
  "NetworkManager",
  "lxqt-policykit",
  "network-manager-applet",
  "nm-connection-editor",
  "rofi",
  "sway",
  "swayidle",
  "swaylock",
  "waybar",
]
wayland_tools = ["grim", "jq", "slurp", "wl-clipboard"]
applications = ["task", "zathura"]

# User-level Python command-line tools installed in isolated uv environments.
[uv_tools]
mdformat = ["mdformat-gfm"]
