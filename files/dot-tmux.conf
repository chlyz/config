# Personal tmux settings

# Use Ctrl-Space as the tmux command prefix instead of the default Ctrl-b.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Toggle to the most recently active window in the current session.
bind C-n last-window

# Maximize the active pane, or return to the master-and-stack layout.
bind C-s run-shell '~/.local/bin/tmux-toggle-master-stack "#{socket_path}" "#{pane_id}"'

# Split horizontally and promote the new left-hand pane to master.
unbind -q <
bind / run-shell '~/.local/bin/tmux-split-master "#{socket_path}" "#{pane_id}"'

# Promote the active pane to the left-most master position, then arrange any
# remaining panes in a stack on the right, like the Sway zoom binding.  If the
# master is active, promote the first stacked pane instead.
bind C-t run-shell '~/.local/bin/tmux-zoom-master "#{socket_path}" "#{pane_id}"'

# Let the mouse wheel scroll tmux history and select panes/windows.
set -g mouse on
set -g mode-keys vi

# Match the usual workspace numbering: the first window is 1, not 0.
set -g base-index 1
set -g renumber-windows on

# Keep the master pane comfortably wide while allowing the layout to scale with
# the terminal rather than using tmux's fixed 80-column default.
set-window-option -g main-pane-width 60%

# Modus Operandi Tinted fallback.  The generated file below tracks set-theme.
set -g status-style "bg=#efe9dd,fg=#193668"
set -g status-left-style "bg=#efe9dd,fg=#005e8b,bold"
set -g status-right-style "bg=#efe9dd,fg=#595959"
set -g window-status-style "bg=#efe9dd,fg=#595959"
set -g window-status-current-style "bg=#c9b9b0,fg=#000000,bold"
set -g message-style "bg=#c9b9b0,fg=#000000"
set -g pane-border-style "fg=#9f9690"
set -g pane-active-border-style "fg=#005e8b"

set -g status-left " #[fg=#005e8b,bold][#S]"
set -g status-right "#[fg=#595959]%Y-%m-%d %H:%M "

if-shell '[ -f ~/.config/modus-theme/tmux.conf ]' 'source-file ~/.config/modus-theme/tmux.conf'
