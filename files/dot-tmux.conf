# Personal tmux settings

# Use Ctrl-Space as the tmux command prefix instead of the default Ctrl-b.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Let the mouse wheel scroll tmux history and select panes/windows.
set -g mouse on
set -g mode-keys vi

# Match the usual workspace numbering: the first window is 1, not 0.
set -g base-index 1
set -g renumber-windows on

# Modus Operandi Tinted fallback.  The generated file below tracks set-theme.
set -g status-style "bg=#efe9dd,fg=#193668"
set -g status-left-style "bg=#efe9dd,fg=#005e8b,bold"
set -g status-right-style "bg=#efe9dd,fg=#595959"
set -g window-status-style "bg=#efe9dd,fg=#595959"
set -g window-status-current-style "bg=#c9b9b0,fg=#000000,bold"
set -g message-style "bg=#c9b9b0,fg=#000000"
set -g pane-border-style "fg=#9f9690"
set -g pane-active-border-style "fg=#005e8b"

set -g status-left " #[fg=#005e8b,bold][#S]"
set -g status-right "#[fg=#595959]%Y-%m-%d %H:%M "

if-shell '[ -f ~/.config/modus-theme/tmux.conf ]' 'source-file ~/.config/modus-theme/tmux.conf'
