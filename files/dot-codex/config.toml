model = "gpt-5.6-terra"
model_reasoning_effort = "medium"

[tui]
status_line = ["model-with-reasoning", "current-dir", "project-name", "run-state", "context-used", "five-hour-limit", "weekly-limit", "fast-mode", "task-progress"]
status_line_use_colors = true
theme = "modus-current"

[tui.keymap.editor]
# Terminal emulators encode Ctrl+Backspace differently: Foot is configured to
# emit Ctrl+W, while GNOME Terminal commonly reports Ctrl+H.  Keep the physical
# shortcut consistent across both.
delete_backward = "backspace"
delete_backward_word = ["ctrl-backspace", "ctrl-w", "ctrl-h"]

[projects."/home/chrly/config"]
trust_level = "trusted"

[projects."/home/chrly/source/i3ipc-dynamic-tiling"]
trust_level = "trusted"

[projects."/home/chrly/Documents/chess"]
trust_level = "trusted"

[projects."/home/chrly/source/ferrichess"]
trust_level = "trusted"
