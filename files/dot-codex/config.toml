model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

[tui]
status_line = [
    "model-with-reasoning",
    "current-dir",
    "project-name",
    "run-state",
    "context-used",
    "five-hour-limit",
    "weekly-limit",
    "fast-mode",
    "task-progress",
]
status_line_use_colors = true
theme = "modus-current"
screen_reader_detection_done = true

[tui.keymap.editor]
# Terminal emulators encode Ctrl+Backspace differently: Foot is configured to
# emit Ctrl+W, while GNOME Terminal commonly reports Ctrl+H.  Keep the physical
# shortcut consistent across both.
delete_backward = "backspace"
delete_backward_word = ["ctrl-backspace", "ctrl-w", "ctrl-h"]

[tui.model_availability_nux]
gpt-6-astra = 4
"gpt-6.1-sol" = 4

