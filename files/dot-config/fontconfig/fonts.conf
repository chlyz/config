<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Use the installed Aporetic Nerd Font for generic monospace requests. -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>AporeticSansMonoNerdFont</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Aporetic Sans</family>
    </prefer>
  </alias>
</fontconfig>
