general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(0d0e1c)
}

label {
    monitor =
    text = $TIME
    color = rgb(ffffff)
    font_size = 56
    font_family = sans-serif
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgb(c6c6d8)
    font_size = 20
    font_family = sans-serif
    position = 0, 95
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    outer_color = rgb(00d3d0)
    capslock_color = rgb(d0bc00)
    inner_color = rgb(1d2235)
    font_color = rgb(ffffff)
    fade_on_empty = false
    rounding = 0
    placeholder_text = Password
    check_text = Checking...
    fail_text = Authentication failed ($ATTEMPTS)
}

label {
    monitor =
    text = Layout: $LAYOUT[Dvorak,Swedish,Colemak,Colemak-DH]
    color = rgb(c6c6d8)
    font_size = 16
    font_family = sans-serif
    position = 0, -75
    halign = center
    valign = center
}
