# Include this file from an existing i3 config with:
#   include ~/.config/i3/dropdown-terminal.conf
#
# The shared launcher detects i3/X11 and matches the terminal by its window
# class.  It also works unchanged from Emacs and from the Sway setup.
bindsym $mod+t exec --no-startup-id ~/.local/bin/toggle-terminal
unbindsym $mod+h
bindsym $mod+h exec --no-startup-id ~/.local/bin/focus-emacs
bindsym $mod+Shift+r exec --no-startup-id ~/.local/bin/reload-wm
bindsym $mod+Return exec --no-startup-id alacritty
for_window [class="dropdown-terminal"] floating enable

# Keep i3's window colors synchronized with the global Modus theme command.
include ~/.config/modus-theme/i3.conf
