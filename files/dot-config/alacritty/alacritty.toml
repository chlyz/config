# Primary terminal configuration for Fedora/Sway and current i3 systems.
# tmux supplies sessions, windows, and panes.
# The generated import keeps the selected Modus theme outside the repository.
[general]
live_config_reload = true
import = ["~/.config/modus-theme/alacritty.toml"]

[font]
size = 14
normal = { family = "monospace" }

[window]
padding = { x = 16, y = 12 }
dynamic_title = false
opacity = 1.0

[selection]
save_to_clipboard = true

# Preserve the system-wide Ctrl+Backspace shortcut in terminal applications.
# Ctrl+W is readline's backward-word-delete byte, understood by Codex and
# shells/editors using readline.
[[keyboard.bindings]]
key = "Back"
mods = "Control"
chars = "\u0017"

[[keyboard.bindings]]
key = "Return"
mods = "Control"
action = "CreateNewWindow"

[[keyboard.bindings]]
key = "Return"
mods = "Control|Shift"
[keyboard.bindings.command]
program = "alacritty"
args = [
    "-e", "nvim", "-c",
    "lua if vim.fn.empty(vim.fn.FugitiveGitDir()) == 0 then vim.cmd.Git(); vim.cmd.only(); vim.cmd.normal([[gU]]) end",
]
