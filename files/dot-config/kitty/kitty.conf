# Kitty remains an optional fallback for Sway/Wayland and i3/X11.
shell /usr/bin/zsh
font_family monospace
font_size 14
window_padding_width 16 12
background_opacity 1.0
# Keep faint text legible if the generated theme has not been created yet.
dim_opacity 0.64
enable_audio_bell no
confirm_os_window_close 0

# set-theme generates this file for the selected Modus palette and reloads
# running Kitty instances when possible.
include ~/.config/modus-theme/kitty.conf

map ctrl+enter launch --type=os-window --cwd=current
map ctrl+shift+enter launch --type=background --cwd=current emacsclient --eval "(my-kitty-project-frame)"
map --allow-fallback=shifted,ascii ctrl+shift+o launch --type=background --cwd=current --stdin-source=@screen_scrollback kitty-scrollback-emacs
