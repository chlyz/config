# Kitty remains an optional fallback for Sway/Wayland and i3/X11.
font_family monospace
font_size 14
window_padding_width 16 12
background_opacity 1.0
# Keep faint text legible if the generated theme has not been created yet.
dim_opacity 0.64
enable_audio_bell no

# set-theme generates this file for the selected Modus palette and reloads
# running Kitty instances when possible.
include ~/.config/modus-theme/kitty.conf
