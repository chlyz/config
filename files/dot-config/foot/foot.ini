# Personal Foot settings
font=monospace:size=14
pad=16x12

# Modus Operandi is the fallback; set-theme supplies the exact Tinted palette.
include=/usr/share/foot/themes/modus-operandi
include=~/.config/modus-theme/foot.ini

[text-bindings]
# Emit readline's backward-word-delete byte for the system-wide shortcut.
\x17=Control+BackSpace

[colors-dark]
alpha=1.0
