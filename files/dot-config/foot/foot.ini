# Personal Foot settings
font=monospace:size=14
pad=16x12

# Modus Operandi is the fallback; set-theme supplies the exact Tinted palette.
include=/usr/share/foot/themes/modus-operandi
include=~/.config/modus-theme/foot.ini

[key-bindings]
spawn-terminal=Control+Shift+n
# Foot runs the pipe command in its tracked directory. Discard the screen text.
# Open Git status only when that directory belongs to a repository.
pipe-visible=[sh -c 'cat >/dev/null; exec foot nvim -c "lua if vim.fn.empty(vim.fn.FugitiveGitDir()) == 0 then vim.cmd.Git(); vim.cmd.normal([[gU]]) end"'] Control+Return

[text-bindings]
# Emit readline's backward-word-delete byte for the system-wide shortcut.
\x17=Control+BackSpace

[colors-dark]
alpha=1.0
